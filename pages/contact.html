<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/responsive.css">
    <script src="../js/main.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="container header-row">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
            Меню
        </button>

        <nav id="site-nav" class="site-nav">
            <ul class="nav-list">
                <li><a href="../index.html">Головна</a></li>
                <li><a href="about.html">Про мене</a></li>
                <li><a href="contact.html">Контакти</a></li>
            </ul>
        </nav>

        <button class="theme-toggle" type="button">Змінити тему</button>
    </div>
</header>

<main class="container">
    <section class="section card">
        <h1>Контакти</h1>
        <p>На цій сторінці можна заповнити форму зворотного зв’язку.</p>

        <form id="contact-form" class="contact-form" action="#" method="get" novalidate>
            <div class="form-group">
                <label for="name">Ім’я:</label>
                <input id="name" name="name" type="text" minlength="2" maxlength="30">
                <small class="error-message" id="name-error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input id="email" name="email" type="email">
                <small class="error-message" id="email-error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input id="phone" name="phone" type="tel" placeholder="+380XXXXXXXXX">
            </div>

            <div class="form-group">
                <label for="topic">Тема:</label>
                <select id="topic" name="topic">
                    <option value="study">Навчання</option>
                    <option value="work">Робота</option>
                    <option value="other">Інше</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Як зручніше зв’язатися</legend>
                <label><input type="radio" name="contactWay" value="email" checked> Email</label>
                <label><input type="radio" name="contactWay" value="phone"> Телефон</label>
            </fieldset>

            <div class="form-group">
                <label for="message">Повідомлення:</label>
                <textarea id="message" name="message" rows="5" maxlength="200"></textarea>
                <div class="char-counter" id="message-counter">0 / 200</div>
                <small class="error-message" id="message-error"></small>
            </div>

            <div class="form-group">
                <label><input type="checkbox" name="agree" id="agree"> Погоджуюсь з правилами</label>
                <small class="error-message" id="agree-error"></small>
            </div>

            <div class="form-actions">
                <button type="submit">Надіслати</button>
                <button type="button" class="clear-draft-btn">Очистити чернетку</button>
            </div>
        </form>

        <div class="form-result" id="form-result" hidden></div>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© <span id="current-year"></span> Роман Ковач</p>
    </div>
</footer>

<button class="back-to-top" type="button" hidden>Вгору</button>

</body>
</html>
