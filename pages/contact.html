<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Контакти</title>
</head>
<body>

<nav>
    <a href="../index.html">Головна</a>
    <a href="about.html">Про мене</a>
    <a href="contact.html">Контакти</a>
</nav>

<h1>Контакти</h1>

<form action="#" method="get">

    <p>
        <label for="name">Ім’я:</label>
        <input id="name" type="text" required>
    </p>

    <p>
        <label for="email">Email:</label>
        <input id="email" type="email" required>
    </p>

    <p>
        <label for="phone">Телефон:</label>
        <input id="phone" type="tel">
    </p>

    <p>
        <label for="topic">Тема:</label>
        <select id="topic">
            <option>Навчання</option>
            <option>Робота</option>
        </select>
    </p>

    <fieldset>
        <legend>Як зв’язатися</legend>
        <label><input type="radio" name="contact"> Email</label>
        <label><input type="radio" name="contact"> Телефон</label>
    </fieldset>

    <p>
        <label for="message">Повідомлення:</label><br>
        <textarea id="message"></textarea>
    </p>

    <p>
        <label>
            <input type="checkbox" required>
            Погоджуюсь
        </label>
    </p>

    <button type="submit">Надіслати</button>

</form>

</body>
</html>
